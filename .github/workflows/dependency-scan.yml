name: Dependency scan

on:
  pull_request:
  schedule:
    - cron: '0 4 * * 0' # weekly on Sundays at 04:00 UTC

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run OWASP dependency-check
        run: |
          set -e
          echo "Fetching latest dependency-check CLI version"
          VERSION=$(curl -s https://dependency-check.github.io/DependencyCheck/current.txt)
          echo "Using dependency-check version $VERSION"
          curl -Ls "https://github.com/dependency-check/DependencyCheck/releases/download/v$VERSION/dependency-check-$VERSION-release.zip" -o dependency-check.zip
          unzip -q dependency-check.zip -d dependency-check
          # Locate the dependency-check CLI. This job uses a standalone Java CLI (downloaded
          # above), so no Gradle wrapper setup / chmod of ./gradlew is needed here.
          DC_SCRIPT=$(find dependency-check -type f -name 'dependency-check.sh' -print -quit)
          if [ -z "$DC_SCRIPT" ]; then
            echo "ERROR: dependency-check.sh not found in extracted release; listing files:" >&2
            find dependency-check -maxdepth 3 -type f -print >&2
            exit 1
          fi
          # Security gate: fail this job when critical-severity (CVSS >= 9.0) findings exist.
          # Reports are still uploaded (next step, if: always()) for triage of lower-severity items.
          mkdir -p dependency-check-report
          chmod +x "$DC_SCRIPT"
          "$DC_SCRIPT" --project "OllamaDev" --scan ./ --format ALL --out dependency-check-report --failOnCVSS 9

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: dependency-check-report*/**
          if-no-files-found: warn
