name: Dependency scan

on:
  pull_request:
  schedule:
    - cron: '0 4 * * 0' # weekly on Sundays at 04:00 UTC

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run OWASP dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -e
          echo "Fetching latest dependency-check CLI version"
          VERSION=$(curl -s https://dependency-check.github.io/DependencyCheck/current.txt)
          echo "Using dependency-check version $VERSION"
          curl -Ls "https://github.com/dependency-check/DependencyCheck/releases/download/v$VERSION/dependency-check-$VERSION-release.zip" -o dependency-check.zip
          unzip -q dependency-check.zip -d dependency-check
          # Locate the dependency-check CLI. This job uses a standalone Java CLI (downloaded
          # above), so no Gradle wrapper setup / chmod of ./gradlew is needed here.
          DC_SCRIPT=$(find dependency-check -type f -name 'dependency-check.sh' -print -quit)
          if [ -z "$DC_SCRIPT" ]; then
            echo "ERROR: dependency-check.sh not found in extracted release; listing files:" >&2
            find dependency-check -maxdepth 3 -type f -print >&2
            exit 1
          fi
          # Security gate: fail this job when critical-severity (CVSS >= 9.0) findings exist.
          # Reports are still uploaded (next step, if: always()) for triage of lower-severity items.
          #
          # NVD feed: the NVD API requires a (free) API key. When the optional NVD_API_KEY
          # repository secret is set, pass it so the feed updates. When it is absent, run with
          # --noupdate so dependency-check uses whatever local NVD data is already cached
          # instead of failing the whole scan on an unreachable/unauthorized feed update.
          # If the scan still can't run because its data source is unavailable, that is an
          # infrastructure failure, not a finding — warn instead of red-gating the PR
          # (this workflow's stated intent is "upload reports, non-failing").
          mkdir -p dependency-check-report
          chmod +x "$DC_SCRIPT"
          DC_SCRIPT_DIR=$(cd "$(dirname "$DC_SCRIPT")" && pwd)
          DC_ARGS=(--project "OllamaDev" --scan ./ --format ALL \
            --out dependency-check-report --failOnCVSS 9)
          if [ -n "$NVD_API_KEY" ]; then
            DC_ARGS+=(--nvdApiKey "$NVD_API_KEY")
          else
            DC_ARGS+=(--noupdate)
          fi
          set +e
          "$DC_SCRIPT" "${DC_ARGS[@]}"
          DC_EXIT=$?
          set -e
          if [ $DC_EXIT -ne 0 ]; then
            DC_LOG=""
            # dependency-check writes its log either in the working dir or beside the CLI;
            # check both + fall back to the NVD feed-update failure exit code (13) seen when
            # no API key / data source is available.
            for candidate in dependency-check.log "$DC_SCRIPT_DIR/dependency-check.log"; do
              if [ -f "$candidate" ]; then DC_LOG=$candidate; break; fi
            done
            if { [ -n "$DC_LOG" ] && grep -qEi 'Unable to continue dependency-check analysis|Error updating the NVD Data|No documents exist|Invalid API Key' "$DC_LOG"; } || [ $DC_EXIT -eq 13 ]; then
              echo "::warning::dependency-check could not update/use the NVD feed; scan degraded. Set the NVD_API_KEY repository secret to enable full critical-CVSS gating."
              exit 0
            fi
            exit $DC_EXIT
          fi

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: dependency-check-report*/**
          if-no-files-found: warn
