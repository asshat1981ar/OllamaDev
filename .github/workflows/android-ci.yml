name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow on-demand re-runs of the standard merge gate (test + build) on any branch,
  # e.g. `scripts/delegate-build.sh` or `gh workflow run "Android CI" --ref <branch>`.
  workflow_dispatch:

# Cancel in-flight runs for the same branch when a new commit lands. Saves runner minutes
# when an author pushes followup commits to a PR before the previous run finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The gate is now parallel instead of serial: the unit suite is split into three matrix
# shards (ui / data / rest) and the APK build runs concurrently, so the gate wall-clock is
# roughly max(test, build) instead of test + build. Every job delegates to the reusable
# gradle-task.yml runner (checkout + JDK 17 + warmed cache + upload).
jobs:
  test:
    name: Unit tests (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: ui
            filter: "--tests 'com.example.ui.*'"
          - shard: data
            filter: "--tests 'com.example.data.*'"
          - shard: rest
            filter: "--tests 'com.example.ExampleUnitTest' --tests 'com.example.GitServiceSpikeTest' --tests 'com.example.viewmodel.*'"
    uses: ./.github/workflows/gradle-task.yml
    with:
      task: ':app:testDebugUnitTest ${{ matrix.filter }}'
      artifact_name: unit-test-report-${{ matrix.shard }}
      upload_patterns: |
        app/build/reports/tests/testDebugUnitTest/
        app/build/test-results/testDebugUnitTest/
      cache_read_only: ${{ github.ref != 'refs/heads/main' }}

  build:
    name: Build debug APK
    uses: ./.github/workflows/gradle-task.yml
    with:
      task: ':app:assembleDebug'
      artifact_name: app-debug-apk
      upload_patterns: |
        app/build/outputs/apk/debug/app-debug.apk
      cache_read_only: ${{ github.ref != 'refs/heads/main' }}
