name: claude

# Tag mode: answers "@claude" on issues, PR comments and reviews. Owner-only on this
# public repo. Branches are pushed as claude/<n>-<slug>; android-ci.yml only runs on PRs
# to main, so open the PR (or run `gh workflow run "Android CI" --ref <branch>`) to build.
on:
  # zizmor: ignore[dangerous-triggers] -- owner-only if:, write-access re-checked by the action, default-branch checkout, secrets never exposed to PR code
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    if: |
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 50
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write        # push claude/<n>-<slug> branches
      pull-requests: write
      issues: write
      actions: read          # mcp__github_ci__* tools
      id-token: write        # Claude GitHub App token exchange (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          branch_prefix: "claude/"
          include_comments_by_actor: "asshat1981ar,coderabbitai[bot]"
          exclude_comments_by_actor: "dependabot[bot],renovate[bot]"
          claude_args: |
            --permission-mode auto
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns 50
            --allowedTools "Bash(./gradlew :app:testDebugUnitTest:*),Bash(./gradlew testDebugUnitTest:*),Bash(./gradlew :app:assembleDebug:*),Bash(./gradlew assembleDebug:*),Bash(./gradlew :app:lintDebug:*),Bash(./gradlew :app:recordRoborazziDebug:*),Bash(./gradlew recordRoborazziDebug:*),Bash(python3 scripts/verify_modern_mcp.py:*),Bash(git status),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(bash scripts/setup_aapt2_qemu.sh:*),Bash(./scripts/setup_aapt2_qemu.sh:*),Bash(bash scripts/delegate-build.sh:*),Bash(./scripts/delegate-build.sh:*),Bash(bash scripts/pull-gradle-cache.sh:*),Bash(gh workflow run:*),Bash(gh api:*),Bash(curl:*)"
            --append-system-prompt "CI context on x86_64. Follow CLAUDE.md design rules for any UI change. Use the run-ollamadev skill commands. Before finishing run ./gradlew :app:testDebugUnitTest and, for UI changes, ./gradlew :app:recordRoborazziDebug --tests com.example.ui.ScreenshotDriverTest and describe the screens you changed."
