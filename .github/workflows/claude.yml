name: claude

# Tag mode: answers "@claude" on issues, PR comments and reviews. Owner-only on this
# public repo. Branches are pushed with the prefix claude/ (the action names the rest);
# android-ci.yml only runs on PRs to main, so open the PR (or run
# `gh workflow run "Android CI" --ref <branch>`) to build and test.
#
# Trust model: tag mode checks out the PR head and holds the OAuth token and an App token.
# So this job (1) refuses cross-repo (fork) PRs, (2) allowlists NO build, test, package
# manager or repo-script command, only read-only git/gh and the action's file tools, and
# (3) scrubs secrets from Claude subprocess env. Claude cannot run Gradle here; CI runs the
# tests on its pushes and holds no secrets. Residual risk: --permission-mode auto may let
# its safety reviewer approve an unlisted command, and a same-repo branch can carry hostile
# files. Both need write access to this repo.
on:
  # zizmor: ignore[dangerous-triggers] -- owner-gated trigger; cross-repo PRs refused by the fork step; no PR code executed (no build/test tools allowlisted); env scrub on
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    if: |
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 50
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    permissions:
      contents: write        # push claude/ branches
      pull-requests: write
      issues: write
      actions: read          # mcp__github_ci__* tools
      id-token: write        # Claude GitHub App token exchange (OIDC)
    steps:
      - name: Refuse cross-repo PRs
        id: fork
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.pull_request && github.event.issue.number || '' }}
        run: |
          # Fail closed: any error means cross=true. Issues and review events (guarded in
          # the job if:) have no PR number here and are same-repo by construction.
          cross=true
          if [ -z "$PR" ]; then
            cross=false
          else
            v=$(gh pr view "$PR" --repo "$REPO" --json isCrossRepository -q .isCrossRepository) || v=true
            [ "$v" = "false" ] && cross=false
          fi
          echo "cross=$cross" >> "$GITHUB_OUTPUT"
          if [ "$cross" = "true" ]; then echo "::notice::cross-repo or unverifiable PR; Claude not run"; fi

      - name: Checkout
        if: steps.fork.outputs.cross != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude
        if: steps.fork.outputs.cross != 'true'
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          branch_prefix: "claude/"
          include_comments_by_actor: "asshat1981ar,coderabbitai[bot]"
          exclude_comments_by_actor: "dependabot[bot],renovate[bot]"
          claude_args: |
            --permission-mode auto
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns 50
            --allowedTools "Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(./gradlew:*),Bash(gradle:*),Bash(python3:*),Bash(bash:*),Bash(sh:*),Bash(gh workflow run:*),Bash(gh api:*),Bash(curl:*)"
            --append-system-prompt "CI context. You cannot run builds, tests or repo scripts in this job; CI runs Gradle on your pushes without secrets, so say what to check there instead of claiming tests passed. Follow CLAUDE.md design rules for any UI change and describe the screens you changed."
