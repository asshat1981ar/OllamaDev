name: claude-screenshot-review

# Label-gated design-rule review, in two jobs so PR code never shares a job with a secret.
#   screenshots: checks out BASE (root) and HEAD (head/), runs Gradle on both, uploads the
#     PNGs. contents: read only, no secrets, no id-token, no write token. Head build scripts
#     DO run here, so this job must stay credential-free.
#   design-review: checks out BASE only (so .claude/ and CLAUDE.md are the trusted base
#     versions), downloads the PNGs into shots/, and lets Claude Read them. No Gradle, no
#     head code, no persisted git credentials, read-only token. Claude returns a typed report.
#   post-review: deterministic job (no Claude, no secrets, pull-requests: write) that posts the
#     report as one comment, with @ neutralised.
# The PNGs are still attacker-influenced input (same-repo branches only); the job keeps only
# regular *.png files under a size cap and Claude treats them as data.
# Add the label "claude:screens" to a same-repo, non-draft PR to run it. Advisory only.
# The paths: filter also applies to the labeled event: labelling a PR whose latest push touched no UI
# path does nothing; push a UI change, or re-label after one.
on:
  pull_request:
    types: [labeled, synchronize]
    paths:
      - "app/src/main/java/com/example/ui/**"
      - "app/src/main/res/**"

permissions: {}

# One PR-scoped group for all three jobs, so a newer push cancels the whole older run.
concurrency:
  group: claude-screenshot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Base and head build on separate runners, so PR-controlled build code in the head
  # job never shares a workspace with the base images it is compared against.
  screenshots-base:
    if: |
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'claude:screens')
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      base-artifact-id: ${{ steps.upload-base.outputs.artifact-id }}
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Record base screenshots
        run: ./gradlew :app:recordRoborazziDebug --tests com.example.ui.ScreenshotDriverTest --no-daemon

      - name: Collect base screenshots
        run: |
          mkdir -p shots/base
          cp app/build/outputs/roborazzi-screens/*.png shots/base/

      - name: Upload base screenshots
        id: upload-base
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens-base
          path: shots/base/
          retention-days: 7

  screenshots-head:
    # Runs after the base artifact exists. Design review downloads the base by the ID recorded
    # here, so head code that deletes or re-uploads screens-base cannot substitute it.
    needs: screenshots-base
    if: |
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'claude:screens')
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Record head screenshots
        run: ./gradlew :app:recordRoborazziDebug --tests com.example.ui.ScreenshotDriverTest --no-daemon

      - name: Collect head screenshots
        run: |
          mkdir -p shots/head
          cp app/build/outputs/roborazzi-screens/*.png shots/head/

      - name: Upload head screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens-head
          path: shots/head/
          retention-days: 7

  design-review:
    needs: [screenshots-base, screenshots-head]
    if: ${{ !cancelled() && needs.screenshots-base.result == 'success' && needs.screenshots-head.result == 'success' && vars.CLAUDE_PAUSE != 'true' && github.actor != 'dependabot[bot]' }}
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    permissions:
      contents: read
    outputs:
      report: ${{ steps.review.outputs.structured_output }}
    steps:
      - name: Checkout base only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require the original base artifact
        env:
          BASE_ID: ${{ needs.screenshots-base.outputs.base-artifact-id }}
        run: |
          # Download by the ID the base job recorded, not by name: head code could delete and
          # re-upload an artifact named screens-base, and a by-name download would pick that up.
          case "$BASE_ID" in ''|*[!0-9]*) echo "::error::base screenshot artifact ID is missing or not numeric"; exit 1 ;; esac

      - name: Download base screenshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.screenshots-base.outputs.base-artifact-id }}
          merge-multiple: true   # extract straight into shots/base; fails if that ID no longer exists
          path: shots/base

      - name: Download head screenshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screens-head
          path: shots/head

      - name: Keep only regular PNGs under a size cap
        run: |
          # Artifacts come from a job that ran PR code: drop anything that is not a plain
          # PNG, and cap size so a hostile image cannot flood Claude's context.
          find shots -type l -delete
          find shots -type f ! -name '*.png' -delete
          find shots -type f -name '*.png' -size +4M -delete
          echo "base: $(find shots/base -type f | wc -l) png, head: $(find shots/head -type f | wc -l) png" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare Bash sandbox (bubblewrap)
        # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB stays on; it needs bubblewrap and unprivileged
        # user namespaces, which Ubuntu 24.04's AppArmor restricts by default.
        if: runner.os == 'Linux'
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null 2>&1; then
            if sudo -n true 2>/dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
            else
              echo "::error::bubblewrap is missing and passwordless sudo is unavailable; install bubblewrap on this runner."
              exit 1
            fi
          fi
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            if [ "$HOSTED" = "true" ] && sudo -n true 2>/dev/null; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            else
              echo "::error::AppArmor blocks unprivileged user namespaces on this self-hosted runner. Allow bwrap (an AppArmor profile, or the sysctl) on the host; this job will not change a self-hosted host setting."
              exit 1
            fi
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc true
          echo "bubblewrap sandbox works"

      - name: Design review
        id: review
        continue-on-error: true
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/screenshot-review PR_NUMBER: ${{ github.event.pull_request.number }}"
          claude_args: |
            --permission-mode auto
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 20
            --add-dir shots
            --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*)"
            --disallowedTools "Edit,MultiEdit,Write,Bash(./gradlew:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh api:*),Bash(gh search:*),Bash(gh pr comment:*),WebFetch,WebSearch"
            --json-schema '{"type":"object","required":["screens_compared","screens_missing","findings"],"properties":{"screens_compared":{"type":"array","items":{"type":"string"}},"screens_missing":{"type":"array","items":{"type":"string"}},"findings":{"type":"array","items":{"type":"object","required":["rule","file","line","message"],"properties":{"rule":{"type":"string"},"file":{"type":"string"},"line":{"type":"integer"},"message":{"type":"string"}}}}}}'

  post-review:
    needs: design-review
    if: ${{ !cancelled() && needs.design-review.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post design review comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          OUT: ${{ needs.design-review.outputs.report }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "::notice::PR head moved from $HEAD_SHA to $current; not posting a stale report."
            exit 0
          fi
          if [ -z "${OUT:-}" ]; then
            echo "::warning::Claude returned no design report (rate limit or error); nothing posted. No report is not a pass."
            exit 0
          fi
          {
            echo "### Claude design-rule review (advisory)"
            echo
            echo "Compared: $(printf '%s' "$OUT" | jq -r '[.screens_compared[]?] | length') screens. Missing on a side: $(printf '%s' "$OUT" | jq -r '[.screens_missing[]?] | length')."
            printf '%s' "$OUT" | jq -r '.screens_missing[]? | "- missing: `\(.[0:120] | gsub("[`\n]";" "))`"'
            echo
            if [ "$(printf '%s' "$OUT" | jq '.findings | length')" = "0" ]; then
              echo "No rule violations found in the compared screens."
            else
              printf '%s' "$OUT" | jq -r '.findings[:30][] | "- **\(.rule[0:80] | gsub("[\n]";" "))** `\((.file // "")[0:160] | gsub("[`\n]";" ")):\(.line // 0)`: \(.message[0:600] | gsub("\n";" ") | gsub("@";"@\u200b"))"'
            fi
            echo
            echo "<!-- claude-design-review -->"
          } > "$RUNNER_TEMP/design.md"
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- claude-design-review -->")))] | last | .id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$RUNNER_TEMP/design.md" >/dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/design.md"
          fi
